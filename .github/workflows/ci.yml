name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux,  arch: amd64, runner: ubuntu-24.04 }
          - { os: linux,  arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-14 }

    steps:
      - uses: actions/checkout@v4

      # ── toolchain ───────────────────────────────────────────────────
      # We pin to clang/lld 22 since the flag set assumes mainline
      # clang-22 features (zstd debug compression in lld, recent CET /
      # PAC / BTI codegen, etc.).
      - name: Install clang 22 (Linux)
        if: matrix.target.os == 'linux'
        run: |
          set -eux
          . /etc/os-release
          codename=${VERSION_CODENAME:-$(lsb_release -cs)}
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 libzstd-dev
          sudo update-alternatives --install /usr/bin/clang  clang  /usr/bin/clang-22  100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-22 100

      - name: Install clang via Homebrew (macOS)
        if: matrix.target.os == 'darwin'
        run: |
          set -eux
          brew install llvm zstd
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Print clang version
        run: clang --version

      - uses: oven-sh/setup-bun@v2

      # ── tests ───────────────────────────────────────────────────────
      - name: Verify cflags.sh / cflags.ts emit identical output
        run: |
          set -eux
          os=${{ matrix.target.os }}
          arch=${{ matrix.target.arch }}
          for mode in "" "--bin"; do
            sh=$(bash ./cli/cflags.sh "$os" "$arch" $mode)
            ts=$(bun run ./cli/cflags.ts "$os" "$arch" $mode)
            if [ "$sh" != "$ts" ]; then
              echo "parity mismatch (mode='${mode:-compile}')"
              diff <(printf '%s\n' "$sh") <(printf '%s\n' "$ts")
              exit 1
            fi
          done

      - name: Compile probe with the compile profile
        run: |
          set -eux
          CFLAGS=$(bash ./cli/cflags.sh ${{ matrix.target.os }} ${{ matrix.target.arch }})
          echo "CFLAGS:" $CFLAGS
          clang $CFLAGS -c tests/probe.c -o /tmp/probe.o

      - name: Compile + link + run probe with the binary profile
        run: |
          set -eux
          BFLAGS=$(bash ./cli/cflags.sh ${{ matrix.target.os }} ${{ matrix.target.arch }} --bin)
          echo "BFLAGS:" $BFLAGS
          clang $BFLAGS tests/probe.c -o /tmp/probe
          /tmp/probe
