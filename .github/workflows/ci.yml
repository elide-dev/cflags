name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux,  arch: amd64, runner: ubuntu-24.04 }
          - { os: linux,  arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-14 }

    steps:
      - uses: actions/checkout@v4

      # Use release archives so compiler and linker cannot drift independently.
      - name: Install LLVM 23.1.4
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target.os }}
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          case "$TARGET_OS-$TARGET_ARCH" in
            linux-amd64)
              asset=LLVM-23.1.4-Linux-X64.tar.xz
              sha=25d814fda50d5fb0084b42be09605d8b1595d49d5e2e03a3345d7e112ff6f9f3 ;;
            linux-arm64)
              asset=LLVM-23.1.4-Linux-ARM64.tar.xz
              sha=9b27cf263d711aa6ebfd4045ab241d947bd09b3cd19ffa5728f48a80c9eb3a91 ;;
            darwin-arm64)
              asset=LLVM-23.1.4-macOS-ARM64.tar.xz
              sha=5d3179db39adeca5b17a34d82708fe976bc60e055b05fe557878fb3fb64d39ef ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 3 \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/$asset" \
            --output "$archive"
          echo "$sha  $archive" | shasum -a 256 -c -
          llvm_prefix="$RUNNER_TEMP/llvm-23.1.4"
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          rm "$archive"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          if [ "$TARGET_OS" = darwin ]; then
            echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
            echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
          fi

      - name: Verify compiler and linker versions
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target.os }}
        run: |
          set -euo pipefail
          for compiler in "$CC" "$CXX"; do
            "$compiler" --version
            test "$("$compiler" -dumpversion)" = 23.1.4
            if "$compiler" --version | grep -q '^Apple clang'; then exit 1; fi
          done
          linker="$(dirname "$CC")/ld.lld"
          if [ "$TARGET_OS" = darwin ]; then linker="$(dirname "$CC")/ld64.lld"; fi
          "$linker" --version
          "$linker" --version | grep -Eq '(^|[^0-9])23\.1\.4([^0-9]|$)'

      - uses: oven-sh/setup-bun@v2

      # ── tests ───────────────────────────────────────────────────────
      - name: Verify cflags.sh / cflags.ts emit identical output
        run: |
          set -eux
          os=${{ matrix.target.os }}
          arch=${{ matrix.target.arch }}
          for mode in "" "--bin"; do
            sh=$(bash ./cli/cflags.sh "$os" "$arch" $mode)
            ts=$(bun run ./cli/cflags.ts "$os" "$arch" $mode)
            if [ "$sh" != "$ts" ]; then
              echo "parity mismatch (mode='${mode:-compile}')"
              diff <(printf '%s\n' "$sh") <(printf '%s\n' "$ts")
              exit 1
            fi
          done

      - name: Compile probe with the compile profile
        run: |
          set -eux
          CFLAGS=$(bash ./cli/cflags.sh ${{ matrix.target.os }} ${{ matrix.target.arch }})
          echo "CC=$CC"
          echo "CFLAGS:" $CFLAGS
          "$CC" $CFLAGS -Werror -c tests/probe.c -o /tmp/probe.o

      - name: Compile + link + run probe with the binary profile
        run: |
          set -eux
          BFLAGS=$(bash ./cli/cflags.sh ${{ matrix.target.os }} ${{ matrix.target.arch }} --bin)
          echo "CC=$CC"
          echo "BFLAGS:" $BFLAGS
          "$CC" $BFLAGS -Werror tests/probe.c -o /tmp/probe
          /tmp/probe

      - name: Check C++ runtime ABI
        shell: bash
        run: |
          set -euo pipefail
          BFLAGS=$(bash ./cli/cflags.sh ${{ matrix.target.os }} ${{ matrix.target.arch }} --bin)
          "$CXX" $BFLAGS -Werror tests/runtime.cpp -o /tmp/runtime-probe
          /tmp/runtime-probe

      - name: Link separately compiled objects into a shared library
        shell: bash
        run: |
          set -euo pipefail
          CFLAGS=$(bash ./cli/cflags.sh ${{ matrix.target.os }} ${{ matrix.target.arch }})
          BFLAGS=$(bash ./cli/cflags.sh ${{ matrix.target.os }} ${{ matrix.target.arch }} --bin)
          "$CC" $CFLAGS -Werror -c tests/shared.c -o /tmp/shared.o
          if [ '${{ matrix.target.os }}' = linux ]; then
            "$CC" $BFLAGS -shared /tmp/shared.o -o /tmp/libprobe.so
          else
            "$CC" $BFLAGS -dynamiclib /tmp/shared.o -o /tmp/libprobe.dylib
          fi
